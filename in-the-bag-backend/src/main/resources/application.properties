spring.application.name=InTheBag

# Database connection settings
spring.datasource.url = jdbc:postgresql://localhost:5433/in_the_bag
spring.datasource.username = postgres
spring.datasource.password = 2603Matu
spring.datasource.driver-class-name = org.postgresql.Driver

# Hibernate settings (JPA for PostgreSQL)
